<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <link rel="manifest" href="/manifest.json">
    <link rel="apple-touch-icon" href="/icon-192.png">
    <meta name="theme-color" content="#131314">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>L.E.F.T.E. v5.5.1 Master</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        :root { --bg: #131314; --card: #1e1f20; --text: #e3e3e3; --accent: #8ab4f8; --border: #444746; }
        * { box-sizing: border-box; }
        body { margin: 0; padding: 10px; font-family: sans-serif; background: var(--bg); color: var(--text); display: grid; grid-template-columns: 1fr 1.2fr 1fr; grid-template-rows: 90px 1fr; gap: 12px; height: 95vh; width: 100vw; overflow: hidden; }

        /* パネル管理 */
        .panel { display: flex; flex-direction: column; gap: 12px; height: 100%; min-height: 0; }
        .widget { background: var(--card); border-radius: 20px; padding: 15px; border: 1px solid var(--border); display: flex; flex-direction: column; overflow: hidden; }

        /* ニュースリストのデザイン */
        /* 1. スクロールバー（表記）をグレーにする設定 */
        #chat-history::-webkit-scrollbar {
            width: 6px;
        }
        #chat-history::-webkit-scrollbar-thumb {
            background: #666; /* つまみをグレーに */
            border-radius: 10px;
        }
        #chat-history::-webkit-scrollbar-track {
            background: transparent;
        }

        /* 2. ニュースのデザインとホバー時のグレー設定 */
        .news-link, .news-link:visited {
            color: #bbb !important; /* デフォルトの文字色を少し落ち着いたグレーに */
            text-decoration: none;
            font-size: 11px;
            display: block;
            padding: 8px 10px;
            transition: all 0.2s;
            border-radius: 8px;
        }

        .news-link:hover {
            background: rgba(255, 255, 255, 0.1) !important; /* ホバー背景を薄いグレーに */
            color: #fff !important; /* 文字を白く浮かび上がらせる */
        }

        /* 3. スクロールボタン（▲▼）を控えめな色に変更 */
        .scroll-controls button {
            /* ... 既存の設定 ... */
            color: #888; /* 青（accent）ではなく、落ち着いたグレーに変更 */
        }

        /* トップバー */
        .top-bar { grid-column: 1 / 4; display: flex; align-items: center; justify-content: space-between; background: var(--card); border-radius: 24px; border: 1px solid var(--border); padding: 0 25px; }
        .brand { display: flex; align-items: center; gap: 12px; }
        .brand-logo { width: 32px; height: 32px; filter: drop-shadow(0 0 5px var(--accent)); }
        #clock { font-size: 34px; font-weight: 200; margin-right: 15px; }

        /* チャットデザイン */
        #chat-history { flex: 1; overflow-y: auto; padding: 10px; display: flex; flex-direction: column; gap: 12px; white-space: pre-wrap; -webkit-overflow-scrolling: touch; }
        .message { max-width: 85%; padding: 12px 16px; border-radius: 18px; font-size: 14px; line-height: 1.5; opacity: 0; transform: translateY(10px); transition: 0.3s ease-out; position: relative; }
        .message.show { opacity: 1; transform: translateY(0); }
        .gemini { background: #1a1a1b; border: 1px solid var(--border); align-self: flex-start; margin-left: 35px; }
        .user { background: #2b2a2a; align-self: flex-end; }

        /* コードブロック・コピーボタン */
        pre { position: relative; background: #000 !important; padding: 15px; border-radius: 10px; border: 1px solid var(--border); margin: 10px 0; overflow-x: auto; }
        code { color: #fff; font-family: monospace; }
        .copy-btn { position: absolute; top: 8px; right: 8px; background: #333; border: 1px solid var(--border); color: #fff; border-radius: 5px; cursor: pointer; font-size: 11px; padding: 4px 8px; opacity: 0.8; }
        .copy-btn:hover { opacity: 1; background: var(--accent); color: var(--bg); }

        /* AIアバター */
        .ai-avatar { position: absolute; left: -35px; top: 0; width: 28px; height: 28px; border-radius: 50%; background: #1a1a1b; border: 1px solid var(--border); display: flex; align-items: center; justify-content: center; font-size: 11px; color: var(--accent); }
        .speaking-icon { animation: ai-breathe 1.5s infinite ease-in-out; border-color: var(--accent); }
        @keyframes ai-breathe { 0% { box-shadow: 0 0 3px var(--accent); } 50% { box-shadow: 0 0 12px var(--accent); } 100% { box-shadow: 0 0 3px var(--accent); } }

        /* 入力エリア */
        .input-wrapper { background: #28292a; padding: 12px; display: flex; align-items: center; border-radius: 18px; gap: 10px; }
        #geminiInput { flex: 1; background: transparent; border: none; color: white; outline: none; }
        #micBtn { background: none; border: none; color: var(--text); cursor: pointer; }
        .recording #micBtn { color: var(--accent); filter: drop-shadow(0 0 8px var(--accent)); }

        /* モデルセレクター */
        .model-selector { display: flex; background: #131314; border: 1px solid var(--border); border-radius: 12px; padding: 3px; }
        .model-selector input { display: none; }
        .model-selector label { padding: 6px 12px; border-radius: 9px; cursor: pointer; font-size: 11px; font-weight: bold; color: #888; transition: 0.2s; }
        .model-selector input:checked + label { background: #1e1f20; color: var(--accent); }

        /* スクロールボタン（チャットパネル内） */
        .scroll-controls { position: absolute; right: 20px; bottom: 85px; display: flex; flex-direction: column; gap: 8px; z-index: 100; }
        .scroll-controls button { width: 42px; height: 42px; border-radius: 50%; background: var(--card); border: 1px solid var(--border); color: var(--accent); cursor: pointer; font-size: 18px; box-shadow: 0 4px 10px rgba(0,0,0,0.4); transition: 0.2s; }
        .scroll-controls button:active { transform: scale(0.9); background: var(--border); }

        iframe { width: 100%; height: 100%; border: none; border-radius: 18px; filter: invert(90%) hue-rotate(180deg); }

        /* モバイル対応 */
        @media (max-width: 768px) {
            body { display: flex !important; flex-direction: column !important; height: 100dvh !important; padding: 0 !important; }
            .panel { display: none !important; flex: 1 !important; }
            .panel.active-panel { display: flex !important; }
            .top-bar { flex: 0 0 65px !important; border-radius: 0 !important; padding: 0 10px !important; }
            .bottom-nav { display: flex !important; height: 70px !important; background: var(--card); border-top: 1px solid var(--border); justify-content: space-around; align-items: center; padding-bottom: env(safe-area-inset-bottom); }
            .nav-item { background: none; border: none; color: #888; flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; cursor: pointer; }
            .nav-item.active { color: var(--accent); }
            .scroll-controls { display: none !important; }
        }
        @media (min-width: 769px) { .bottom-nav { display: none !important; } }
    </style>
</head>
<body>

<div class="top-bar">
    <div class="brand">
        <svg class="brand-logo" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2a10 10 0 1 0 10 10A10 10 0 0 0 12 2zm0 18a8 8 0 1 1 8-8 8 8 0 0 1-8 8z"/><circle cx="12" cy="12" r="3"/><path d="M12 7v2m0 6v2m-5-5h2m6 0h2"/></svg>
        <div style="font-size:16px; font-weight:bold;">L.E.F.T.E. <span style="font-size:9px; color:var(--accent);">v5.5.1</span></div>
    </div>
    <div style="display:flex; align-items:center;">
        <div id="clock">00:00</div>
        <div id="weather">--°C</div>
        <button onclick="location.reload()" style="background:#28292a; border:1px solid var(--border); color:white; border-radius:50%; width:30px; height:30px; cursor:pointer; margin-right:10px;">⟳</button>
    </div>
    <div class="model-selector">
        <input type="radio" id="m-flash" name="modelSelect" value="gemini-3-flash-preview" checked>
        <label for="m-flash">⚡ Flash</label>
        <input type="radio" id="m-pro" name="modelSelect" value="gemini-2.5-pro">
        <label for="m-pro">🧠 Pro</label>
    </div>
</div>

<div id="news-panel" class="panel" style="grid-column: 1;">
    <div class="widget" style="flex: 1; min-height: 0;">
        <h3 style="margin:0 0 10px 0; font-weight:300; font-size:16px;">News</h3>
        <div id="news-container" style="overflow-y:auto;"></div>
    </div>
</div>

<div id="chat-panel" class="panel" style="grid-column: 2; position: relative;">
    <div class="scroll-controls">
        <button onmousedown="startScroll(-15)" onmouseup="stopScroll()" onmouseleave="stopScroll()" ontouchstart="startScroll(-15)" ontouchend="stopScroll()">▲</button>
        <button onmousedown="startScroll(15)" onmouseup="stopScroll()" onmouseleave="stopScroll()" ontouchstart="startScroll(15)" ontouchend="stopScroll()">▼</button>
    </div>
    <div class="widget" style="flex: 1; padding: 0;">
        <div id="chat-history"></div>
        <div id="preview-container" style="padding:10px; border-top:1px solid var(--border); display:none;"></div>
        <div style="padding:12px;">
            <div class="input-wrapper">
                <button id="fileBtn" style="background:none; border:none; color:var(--text); font-size:20px;">＋</button>
                <input type="text" id="geminiInput" placeholder="ボクに話しかけてね...">
                <button id="micBtn"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" x2="12" y1="19" y2="22"/></svg></button>
                <button id="sendBtn" style="background:none; border:none; color:var(--accent); font-size:20px;">➤</button>
            </div>
        </div>
    </div>
    <input type="file" id="fileInput" style="display:none;">
</div>

<div id="calendar-panel" class="panel" style="grid-column: 3;">
    <div class="widget" style="flex: 1; padding: 0;">
        <iframe src="https://calendar.google.com/calendar/embed?src=iwayashuntaman%40gmail.com&ctz=Asia%2FTokyo" style="border: 0" width="100%" height="100%"></iframe>
    </div>
</div>

<div class="bottom-nav">
    <button class="nav-item" onclick="switchTab('news', event)"><span>📰</span><small>ニュース</small></button>
    <button class="nav-item active" onclick="switchTab('chat', event)"><span>💬</span><small>チャット</small></button>
    <button class="nav-item" onclick="switchTab('calendar', event)"><span>📅</span><small>予定</small></button>
</div>

<script>
    let selectedFileBase64 = null, selectedMimeType = null;
    const chatHistory = document.getElementById('chat-history');

    // 時計・ニュース・天気
    setInterval(() => { document.getElementById('clock').innerText = new Date().toLocaleTimeString('ja-JP', {hour:'2-digit', minute:'2-digit'}); }, 1000);
    fetch(`https://api.rss2json.com/v1/api.json?rss_url=https://news.google.com/rss?hl=ja&gl=JP&ceid=JP:ja`)
        .then(r=>r.json())
        .then(d=>document.getElementById('news-container').innerHTML = d.items.slice(0, 10).map(i => `<div class="news-item"><a href="${i.link}" target="_blank" class="news-link">${i.title}</a></div>`).join(''));

    fetch(`https://api.open-meteo.com/v1/forecast?latitude=34.3796&longitude=132.4026&current_weather=true`)
        .then(r=>r.json())
        .then(d=>document.getElementById('weather').innerText = `${Math.round(d.current_weather.temperature)}°C`);

    // タブ切り替え
    window.switchTab = function(t, e) {
        document.querySelectorAll('.panel').forEach(p => { p.style.display = 'none'; p.classList.remove('active-panel'); });
        document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
        const target = document.getElementById(t + '-panel');
        if (target) { target.style.display = 'flex'; target.classList.add('active-panel'); }
        if (e) e.currentTarget.classList.add('active');
    };
    if (window.innerWidth <= 768) switchTab('chat');

    // コピーボタン
    function addCopyButtons(container) {
        container.querySelectorAll('pre').forEach((pre) => {
            const code = pre.querySelector('code');
            if (!code || pre.querySelector('.copy-btn')) return;
            const button = document.createElement('button');
            button.innerText = 'Copy';
            button.className = 'copy-btn';
            button.onclick = () => {
                navigator.clipboard.writeText(code.innerText).then(() => {
                    button.innerText = 'Copied!';
                    setTimeout(() => button.innerText = 'Copy', 2000);
                });
            };
            pre.appendChild(button);
        });
    }

    function addMessageToUI(role, text) {
        const hist = document.getElementById('chat-history');
        const bubble = document.createElement('div');
        const displayRole = role === 'assistant' ? 'gemini' : 'user';
        bubble.className = `message ${displayRole} show`;

        if (displayRole === 'gemini') {
            const content = marked.parse(text);
            bubble.innerHTML = `<div class="ai-avatar">L</div><div class="res-txt">${content}</div>`;
            addCopyButtons(bubble);
        } else {
            bubble.innerText = text;
        }
        hist.appendChild(bubble);
        hist.scrollTop = hist.scrollHeight;
        return bubble;
    }

    async function loadHistory() {
    try {
        const response = await fetch('/history');
        if (!response.ok) return;

        const history = await response.json();
        const chatHistoryElement = document.getElementById('chat-history');

        // 🚀 重要：一度画面をクリアしてから、取得した履歴を 1 つずつ追加する
        chatHistoryElement.innerHTML = '';

        history.forEach(msg => {
            // role が 'user' か 'assistant' かで判定
            addMessageToUI(msg.role, msg.content);
        });

        // 最後に一番下までスクロール
        chatHistoryElement.scrollTop = chatHistoryElement.scrollHeight;
    } catch (error) {
        console.error("履歴の読み込み中にエラーが発生しました:", error);
    }
}

// 🚀 ページが読み込まれたら履歴を取得する
document.addEventListener('DOMContentLoaded', loadHistory);

    async function runTypewriter(el, fullTxt, url) {
        const displayTxt = fullTxt.replace(/\(.*\)/g, '').replace(/（.*）/g, '');
        let i = 0; el.innerHTML = "";
        const audio = new Audio(url);
        const av = el.parentElement.parentElement.querySelector('.ai-avatar');
        audio.onplay = () => av.classList.add('speaking-icon');
        audio.onended = () => av.classList.remove('speaking-icon');
        audio.play();
        return new Promise(res => {
            function type() {
                if (i < displayTxt.length) {
                    el.innerText += displayTxt.charAt(i); i++;
                    setTimeout(type, 30);
                } else {
                    el.innerHTML = marked.parse(displayTxt);
                    addCopyButtons(el);
                    res();
                }
                chatHistory.scrollTop = chatHistory.scrollHeight;
            }
            type();
        });
    }

    async function ask() {
        const input = document.getElementById('geminiInput');
        const text = input.value.trim();
        const model = document.querySelector('input[name="modelSelect"]:checked').value;
        if (!text && !selectedFileBase64) return;

        const f64 = selectedFileBase64; const mime = selectedMimeType;
        selectedFileBase64 = null;
        document.getElementById('preview-container').style.display = 'none';

        if (f64) {
            chatHistory.innerHTML += `<div class="message user show" style="background:transparent; padding:0; align-self:flex-end;"><img src="data:${mime};base64,${f64}" style="max-height:280px; border-radius:15px;"></div>`;
        }
        if (text) addMessageToUI('user', text);
        input.value = '';

        const bubble = addMessageToUI('assistant', '...');
        const resTxtElement = bubble.querySelector('.res-txt');

        try {
            const res = await fetch('/chat', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ message: text, image: f64, mime_type: mime, model: model })
            });
            const data = await res.json();

            // 🚀 信号があれば Windows プロトコルを呼び出し
            if (data.launch_url) {
                console.log("Launching:", data.launch_url);
                window.location.href = data.launch_url;
            }

            await runTypewriter(resTxtElement, data.response, data.voice_url);
        } catch (e) {
            resTxtElement.innerText = "エラーになっちゃった...";
        }
    }

    // スクロールボタンのロジック
    let scrollInterval = null;
    function startScroll(amount) {
        chatHistory.scrollBy({ top: amount, behavior: 'auto' });
        scrollInterval = setInterval(() => { chatHistory.scrollBy({ top: amount, behavior: 'auto' }); }, 30);
    }
    function stopScroll() { if (scrollInterval) { clearInterval(scrollInterval); scrollInterval = null; } }
    
    // 音声認識
    const rec = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
    rec.lang = 'ja-JP';
    document.getElementById('micBtn').onclick = () => { rec.start(); document.body.classList.add('recording'); };
    rec.onresult = (e) => { document.getElementById('geminiInput').value = e.results[0][0].transcript; ask(); };
    rec.onend = () => { document.body.classList.remove('recording'); };

    // 各種ボタン・キーイベント
    document.getElementById('sendBtn').onclick = ask;
    document.getElementById('geminiInput').onkeydown = (e) => { if(e.key==='Enter') ask(); };
    document.getElementById('fileBtn').onclick = () => document.getElementById('fileInput').click();
    document.getElementById('fileInput').onchange = (e) => {
        const f = e.target.files[0]; if (!f) return;
        const r = new FileReader(); r.onload = (e) => {
            selectedFileBase64 = e.target.result.split(',')[1]; selectedMimeType = f.type;
            document.getElementById('preview-container').innerHTML = `<img src="${e.target.result}" style="max-height:80px; border-radius:10px;">`;
            document.getElementById('preview-container').style.display = 'block';
        }; r.readAsDataURL(f);
    };

    // スマホ用スワイプ遷移
    let touchStartX = 0; let touchEndX = 0;
    const tabs = ['news', 'chat', 'calendar'];
    window.addEventListener('touchstart', e => { touchStartX = e.changedTouches[0].screenX; }, false);
    window.addEventListener('touchend', e => { touchEndX = e.changedTouches[0].screenX; handleSwipe(); }, false);
    function handleSwipe() {
        const distance = touchEndX - touchStartX;
        const currentTab = document.querySelector('.nav-item.active').innerText.includes('ニュース') ? 'news' :
                           document.querySelector('.nav-item.active').innerText.includes('チャット') ? 'chat' : 'calendar';
        const currentIndex = tabs.indexOf(currentTab);
        if (distance > 70 && currentIndex > 0) switchTab(tabs[currentIndex - 1]);
        else if (distance < -70 && currentIndex < 2) switchTab(tabs[currentIndex + 1]);
    }

    // PWAサービスワーカー登録
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('/service-worker.js')
                .then(reg => console.log('SW Registered'))
                .catch(err => console.log('SW Registration Failed', err));
        });
    }
</script>
</body>
</html>
